<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Insight Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 图标集：lucide 线稿，统一 16px / 1.5 stroke -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9-9-9Z"/><circle cx="8" cy="8" r="1.2"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- ── 侧栏 ─────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">AI</div>
      <div class="brand-text">
        <span class="brand-name">Insight Hub</span>
        <span class="brand-sub">个人资料库</span>
      </div>
    </div>

    <!-- 主统计：总条目数是这一屏唯一的大数字 -->
    <section class="side-hero">
      <div class="hero-figure">
        <span class="hero-number" data-stat="total">–</span>
        <span class="hero-label">条资料</span>
      </div>
      <div class="hero-split">
        <div class="split-item" data-key="done">
          <span class="split-number" data-stat="done">–</span>
          <span class="split-label">已完成</span>
        </div>
        <div class="split-item" data-key="failed">
          <span class="split-number" data-stat="failed">–</span>
          <span class="split-label">失败</span>
        </div>
        <div class="split-item" data-key="categories">
          <span class="split-number" data-stat="categories">–</span>
          <span class="split-label">分类</span>
        </div>
        <div class="split-item" data-key="tags">
          <span class="split-number" data-stat="tags">–</span>
          <span class="split-label">标签</span>
        </div>
      </div>
      <dl class="stats" id="stats" hidden></dl>
    </section>

    <section class="side-section">
      <h2 class="side-label">分类</h2>
      <ul class="facets" id="categories"></ul>
    </section>

    <section class="side-section side-section--grow">
      <h2 class="side-label">标签</h2>
      <ul class="facets facets--cloud" id="tags"></ul>
    </section>

    <div class="side-foot">
      <div class="model-row">
        <span class="model-dot" id="model-dot" aria-hidden="true"></span>
        <span class="model-name" id="model-name">–</span>
      </div>
      <span class="model-provider" id="model-provider"></span>
    </div>
  </aside>

  <!-- ── 主区 ─────────────────────────────────────────── -->
  <main class="main">

    <header class="main-head">
      <div class="head-text">
        <h1 class="page-title" id="page-title">全部资料</h1>
        <p class="page-meta" id="page-meta">–</p>
      </div>
    </header>

    <!-- 录入：紧凑单行，聚焦/多行时自动展开 -->
    <section class="compose" id="compose">
      <form class="compose-form" id="compose-form" novalidate>
        <textarea
          id="compose-input"
          class="textarea"
          rows="1"
          placeholder="粘贴网址，或输入要归档的文本…"
          aria-label="网址或文本"
        ></textarea>
        <button class="btn btn--primary compose-submit" type="submit" id="submit-compose">分析</button>
      </form>
      <div class="compose-meta">
        <p class="form-error" id="compose-error" role="alert" hidden></p>
        <span class="compose-hint" id="compose-hint">Enter 提交 · Shift+Enter 换行</span>
      </div>
    </section>

    <!-- 搜索栏 -->
    <div class="toolbar">
      <div class="search">
        <svg class="ico search-ico" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="search" class="search-input" placeholder="搜索标题、摘要、正文" autocomplete="off">
      </div>

      <!-- 状态筛选：默认只看已完成，失败条目收在开关后面 -->
      <div class="segmented" id="status-filter" role="group" aria-label="按状态筛选">
        <button type="button" class="segment" data-status="done" aria-pressed="true">已完成</button>
        <button type="button" class="segment" data-status="failed" aria-pressed="false">失败</button>
        <button type="button" class="segment" data-status="all" aria-pressed="false">全部</button>
      </div>

      <div class="filters" id="active-filters"></div>
    </div>

    <!-- 列表 -->
    <section class="list-wrap">
      <ul class="card-list" id="list"></ul>
      <div class="empty" id="empty" hidden>
        <svg class="ico ico--lg" aria-hidden="true"><use href="#i-file"/></svg>
        <p class="empty-title" id="empty-title">还没有资料</p>
        <p class="empty-text" id="empty-text">贴一个网址或一段文本，系统会抓取正文并生成摘要、标签和分类</p>
      </div>
    </section>

  </main>
</div>

<!-- ── 详情弹层 ──────────────────────────────────────── -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" id="modal-panel">
    <div class="modal-head">
      <span class="record-no" id="modal-no"></span>
      <button class="icon-btn" type="button" data-close aria-label="关闭">
        <svg class="ico" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
